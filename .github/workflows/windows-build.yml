name: Windows Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run unit & regression tests
        run: npm test

      - name: Build frontend and main process
        run: npm run build

      - name: Package Windows executable & installer
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titan-monitor-windows-binaries
          path: release/*.exe
          retention-days: 14

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path |
            Format-Table -AutoSize | Out-String | Set-Content release/checksums.txt
          Get-Content release/checksums.txt

      - name: Create GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
